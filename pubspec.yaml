name: racist_meme_app
description: A simple Flutter world time app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.6

flutter:
  uses-material-design: true

  assets:
    - assets/day.png
    - assets/night.png
    - assets/uk.png
    - assets/germany.png
    - assets/greece.png
    - assets/egypt.png
    - assets/kenya.png
    - assets/usa.png
    - assets/south_korea.png
    - assets/indonesia.png
